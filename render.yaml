databases:
  - name: carebridge-db
    databaseName: carebridge
    user: carebridge_user
    region: singapore
    plan: free

services:
  - type: web
    name: carebridge-ai
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carebridge-db
          property: connectionString
      - key: CRON_API_KEY
        generateValue: true
      - key: SMTP_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM
        value: "CareBridge AI <notifications@carebridge.ai>"
      - key: SMTP_TLS
        value: "true"
      - key: MAX_PIN_ATTEMPTS
        value: "5"
      - key: PIN_LOCKOUT_MINUTES
        value: "15"
      - key: DOSE_GRACE_PERIOD_MINUTES
        value: "60"
      - key: REMINDER_WINDOW_MINUTES
        value: "30"
